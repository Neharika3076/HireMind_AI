  <title>TerraHire — Portal Login</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"

<body
  style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse 65% 50% at 50% 20%, rgba(20, 184, 166, 0.18), transparent 60%), radial-gradient(ellipse 50% 60% at 85% 85%, rgba(30, 58, 95, 0.4), transparent 60%), var(--navy-950);">

  <div class="login-card">
    <div class="login-header">
      <a href="./index.html" class="login-logo">
        <span class="mark" aria-hidden="true"></span>
        TerraHire
      </a>
      <h2 class="login-title">Sign in to TerraHire</h2>
      <p class="login-sub">Enter your Project Code or Admin Email and Password.</p>
    </div>

    <form id="form-login" novalidate>
      <!-- Input Box 1: Identifier (Admin Email or Project Code) -->
      <div class="form-group">
        <label for="input-identifier">Admin Email or Project Code</label>
        <input type="text" id="input-identifier" placeholder="e.g. khushi123@gmail.com or BILL-01" required
          autocomplete="username">
      </div>

      <!-- Input Box 2: Password -->
      <div class="form-group">
        <label for="input-password">Password</label>
        <input type="password" id="input-password" placeholder="Enter your password" required
          autocomplete="current-password">
      </div>

      <div id="login-error" class="err" style="margin-bottom:14px; font-weight:500;"></div>

      <button type="submit" class="btn btn-primary" style="width:100%; padding:13px; font-size:15px; margin-top:8px;"
        id="btn-login-submit">
        Sign In to Portal →
      </button>
    </form>
