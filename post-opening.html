<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Post a Job Opening | Krew</title>
    <link rel="stylesheet" href="careers.css">
</head>

<body>
    <header class="site-header"><a class="brand" href="index.html">Krew <span>Employer portal</span></a><a
            class="back-link" href="job-openings.html">All job openings</a></header>
    <main>
        <div class="form-shell">
            <div id="verify-step">
                <div class="eyebrow">Secure employer access</div>
                <h1 class="form-title">Verify your organization</h1>
                <p class="form-subtitle">Use the organization code and email for your signed-in administrator account.
                </p>
                <form id="verification-form">
                    <div class="form-grid">
                        <div class="field"><label>Organization code<input id="org-code" required></label></div>
                        <div class="field"><label>Administrator email<input id="admin-email" type="email"
                                    required></label></div>
                    </div>
                    <div id="verify-error" class="form-error"></div>
                    <div class="form-actions"><button class="primary-button">Verify and continue</button></div>
                </form>
            </div>
            <div id="posting-step" hidden>
                <div class="eyebrow">Administrator verified</div>
                <h1 class="form-title">Create a job opening</h1>
                <form id="post-job-form">
                    <div class="form-grid">
                        <div class="field"><label>Job role / title<input id="job-title" required></label></div>
                        <div class="field"><label>Company name<input id="company-name" required></label></div>
                        <div class="field full"><label>Job description<textarea id="job-description"
                                    required></textarea></label></div>
                        <div class="field"><label>Opening duration<select id="duration" required>
                                    <option value="">Select duration</option>
                                    <option>7 days</option>
                                    <option>14 days</option>
                                    <option>30 days</option>
                                    <option>60 days</option>
                                </select></label></div>
                        <div class="field"><label>Seats available<input id="seats" type="number" min="1"
                                    required></label></div>
                        <div class="field full"><label>Workplace type<select id="workplace" required>
                                    <option value="">Select type</option>
                                    <option>Remote</option>
                                    <option>Hybrid</option>
                                    <option>On-site</option>
                                </select></label></div>
                    </div>
                    <div id="post-error" class="form-error"></div>
                    <div class="form-actions"><button class="primary-button">Publish job opening</button></div>
                </form>
            </div>
        </div>
    </main>
    <div class="done" id="posted">
        <div class="done-card">
            <div class="eyebrow">Opening published</div>
            <h2>Your job is live.</h2>
            <p id="published-message"></p><a class="primary-button" href="job-openings.html">View job openings</a>
        </div>
    </div>
    <script src="state.js"></script>
    <script src="tenant.js"></script>
    <script src="careers.js"></script>
</body>

</html>
